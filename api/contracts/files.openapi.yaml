openapi: 3.0.3
info:
  title: CrediMerc Files API
  version: 0.1.0
  description: Endpoints para gestionar adjuntos con subida directa a S3.
servers:
  - url: https://api.credimerc.com
  - url: http://localhost:3000
security:
  - bearerAuth: []
paths:
  /api/files/upload-url:
    post:
      summary: Solicita URL firmada para subir archivo a S3
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadUrlRequest'
      responses:
        '200':
          description: URL firmada generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUploadUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/files/confirm:
    post:
      summary: Confirma un archivo subido y lo deja en estado ACTIVE
      tags: [Files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUploadRequest'
      responses:
        '200':
          description: Archivo confirmado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/files:
    get:
      summary: Lista archivos por owner y categoria
      tags: [Files]
      parameters:
        - in: query
          name: ownerType
          schema:
            $ref: '#/components/schemas/OwnerType'
          required: true
        - in: query
          name: ownerId
          schema:
            type: integer
            format: int64
          required: true
        - in: query
          name: category
          schema:
            $ref: '#/components/schemas/Category'
      responses:
        '200':
          description: Lista de archivos
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttachmentItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/files/{id}/download-url:
    get:
      summary: Obtiene URL firmada de descarga
      tags: [Files]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: URL firmada de descarga
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
                  downloadUrl:
                    type: string
                    format: uri
                  expiresInSeconds:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/files/{id}:
    delete:
      summary: Elimina (soft delete) un archivo
      tags: [Files]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Archivo eliminado
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/files/{id}/review:
    post:
      summary: Aprueba o rechaza un archivo de identidad
      tags: [Files]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approve, reject]
                notes:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Resultado de revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    OwnerType:
      type: string
      enum: [USER, COMPANY_USER, CUSTOMER, LOAN_PAYMENT, COLLECTION_VISIT]

    Category:
      type: string
      enum: [PROFILE_PHOTO, ID_FRONT, ID_BACK, SELFIE_VERIFICATION, SUPPORTING_DOCUMENT]

    CreateUploadUrlRequest:
      type: object
      required: [ownerType, ownerId, category, mimeType, sizeBytes, originalFileName]
      properties:
        ownerType:
          $ref: '#/components/schemas/OwnerType'
        ownerId:
          type: integer
          format: int64
        category:
          $ref: '#/components/schemas/Category'
        mimeType:
          type: string
          example: image/jpeg
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        originalFileName:
          type: string
          example: dui_frente.jpg

    CreateUploadUrlResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        publicId:
          type: string
          format: uuid
        bucket:
          type: string
        objectKey:
          type: string
        uploadUrl:
          type: string
          format: uri
        expiresInSeconds:
          type: integer

    ConfirmUploadRequest:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
        checksumSha256:
          type: string
          minLength: 64
          maxLength: 64

    AttachmentItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        publicId:
          type: string
          format: uuid
        companyId:
          type: integer
          format: int64
        ownerType:
          $ref: '#/components/schemas/OwnerType'
        ownerId:
          type: integer
          format: int64
        category:
          $ref: '#/components/schemas/Category'
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        status:
          type: string
          enum: [UPLOADING, ACTIVE, REJECTED, DELETED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string

  responses:
    BadRequest:
      description: Peticion invalida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Unauthorized:
      description: No autenticado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
